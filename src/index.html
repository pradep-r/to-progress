<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Learn English — Articles (a / the)</title>
  </head>
  <body>
    <div id="app" class="app">
      <header class="header">
        <h1>Learn English</h1>
        <p class="subtitle">Choose the article (a / the)</p>
      </header>

      <main class="main">
        <div class="main-row">
          <section class="image-section" aria-label="Object to describe">
            <div class="image-wrapper">
              <img id="lesson-image" src="" alt="" class="lesson-image" />
            </div>
          </section>

          <section class="questions-section" aria-label="Practice articles">
            <div id="questions-container" class="questions-container"></div>
          </section>

          <section class="questions-section" aria-label="Practice articles">
            <div>
              <section
                id="answer-section"
                class="answer-section"
                aria-label="Your answer"
                hidden
              >
                <h4 style="margin-bottom: 10px">Speak your sentence</h4>
                <p id="sentence-display" class="sentence-display"></p>

                <button
                  type="button"
                  id="pronounce-btn"
                  class="toolbar-btn pronounce-btn"
                  aria-label="Listen to the word"
                  style="margin-top: 10px"
                >
                  Listen
                </button>
              </section>
            </div>
          </section>
        </div>
      </main>
    </div>
  </body>
</html>
