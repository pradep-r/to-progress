<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Learn English — Build the sentence</title>
  <script defer src="main.js"></script></head>
  <body>
    <div id="app" class="app">
      <header class="header">
        <h1>Learn English</h1>
        <p class="subtitle">Answer the questions to build the sentence</p>
      </header>

      <main class="main">
        <section class="image-section" aria-label="Object to describe">
          <div class="image-wrapper">
            <img id="lesson-image" src="" alt="" class="lesson-image" />
          </div>
        </section>

        <section class="sentence-section" aria-label="Your sentence">
          <h2>Your sentence</h2>
          <p id="sentence-display" class="sentence-display"></p>
        </section>

        <section class="questions-section" aria-label="Questions">
          <h2>Answer the questions</h2>
          <div id="questions-container" class="questions-container"></div>
        </section>
      </main>
    </div>
  </body>
</html>
